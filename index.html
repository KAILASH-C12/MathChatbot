<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Solver Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap');
        
        :root {
            --primary: #9c27b0;
            --secondary: #673ab7;
            --accent: #ffd700;
            --dark: #121212;
            --darker: #0a0a0a;
        }
        
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--dark);
            margin: 0;
            overflow: hidden;
            color: #ffffff;
        }
        
        .chat-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }
        
        .chat-header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 1.5rem;
            text-align: center;
            box-shadow: 0 4px 30px rgba(156, 39, 176, 0.6);
            position: relative;
            overflow: hidden;
            border-bottom: 1px solid rgba(255, 215, 0, 0.3);
        }
        
        .chat-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            animation: headerGlow 3s linear infinite;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            background: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(12px);
            position: relative;
        }
        
        .message {
            max-width: 80%;
            padding: 1.25rem;
            border-radius: 1rem;
            line-height: 1.6;
            animation: fadeIn 0.4s ease-out;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
            border: 1px solid transparent;
        }
        
        .message::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.8), transparent);
            animation: messageGlow 4s linear infinite;
            opacity: 0.6;
        }
        
        .user-message {
            align-self: flex-end;
            background: linear-gradient(135deg, #2196f3, #1976d2);
            color: white;
            border-radius: 1.25rem 1.25rem 0 1.25rem;
            border-color: rgba(255, 255, 255, 0.15);
        }
        
        .bot-message {
            align-self: flex-start;
            background: linear-gradient(135deg, var(--secondary), #5e35b1);
            color: white;
            border-radius: 1.25rem 1.25rem 1.25rem 0;
            border-color: rgba(255, 255, 255, 0.15);
        }
        
        .welcome-message {
            background: rgba(40, 40, 40, 0.95);
            border-radius: 1.25rem;
            padding: 2rem;
            margin-bottom: 1rem;
            border: 1px solid var(--accent);
            box-shadow: 0 8px 25px rgba(255, 215, 0, 0.25);
            position: relative;
            overflow: hidden;
        }
        
        .welcome-message::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,215,0,0.1) 0%, transparent 70%);
            animation: rotateGradient 15s linear infinite;
        }
        
        .input-area {
            display: flex;
            gap: 1rem;
            padding: 1.5rem;
            background: rgba(40, 40, 40, 0.95);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            position: relative;
        }
        
        .input-area::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            animation: inputGlow 3.5s linear infinite;
        }
        
        .math-input {
            flex: 1;
            background: rgba(30, 30, 30, 0.95);
            border: 2px solid rgba(255, 215, 0, 0.6);
            border-radius: 0.85rem;
            padding: 1.25rem;
            color: white;
            font-size: 1.1rem;
            outline: none;
            transition: all 0.4s ease;
            box-shadow: 0 0 0 rgba(255, 215, 0, 0);
        }
        
        .math-input:focus {
            border-color: rgba(255, 215, 0, 0.9);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
        }
        
        .send-button {
            background: linear-gradient(135deg, var(--accent), #ffb800);
            color: var(--darker);
            border: none;
            border-radius: 0.85rem;
            padding: 0 2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
        }
        
        .send-button::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                to bottom right,
                transparent, transparent, transparent,
                rgba(255, 255, 255, 0.3),
                transparent, transparent, transparent
            );
            transform: rotate(30deg);
            animation: buttonShine 3s infinite;
        }
        
        .send-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 215, 0, 0.7);
        }
        
        .example-button {
            background: rgba(50, 50, 50, 0.95);
            border: 1px solid rgba(255, 215, 0, 0.6);
            border-radius: 0.75rem;
            padding: 0.85rem 1.25rem;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Courier New', monospace;
            font-weight: 600;
            position: relative;
            overflow: hidden;
        }
        
        .example-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.2), transparent);
            transition: all 0.6s ease;
        }
        
        .example-button:hover {
            background: rgba(60, 60, 60, 0.95);
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.4);
        }
        
        .example-button:hover::before {
            left: 100%;
        }
        
        .loading-spinner {
            border: 3px solid rgba(255, 215, 0, 0.2);
            border-top-color: var(--accent);
            border-radius: 50%;
            width: 28px;
            height: 28px;
            animation: spin 1s linear infinite;
            position: relative;
        }
        
        .loading-spinner::after {
            content: '';
            position: absolute;
            top: -3px;
            left: -3px;
            right: -3px;
            bottom: -3px;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: rgba(255, 215, 0, 0.4);
            animation: spin 1.5s linear infinite reverse;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-25px) rotate(5deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }
        
        @keyframes rotateGradient {
            to { transform: rotate(360deg); }
        }
        
        @keyframes buttonShine {
            0% { left: -100%; }
            20% { left: 100%; }
            100% { left: 100%; }
        }
        
        @keyframes headerGlow {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        
        @keyframes messageGlow {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        
        @keyframes inputGlow {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        
        @keyframes particlePulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }
        
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }
        
        .floating-math {
            position: absolute;
            color: rgba(255, 255, 255, 0.8);
            font-size: 28px;
            font-weight: bold;
            z-index: 5;
            animation: float 8s ease-in-out infinite;
            text-shadow: 0 0 15px var(--accent);
            filter: drop-shadow(0 0 5px rgba(255, 215, 0, 0.7));
            opacity: 0.9;
        }
        
        .floating-math.small {
            font-size: 20px;
            opacity: 0.7;
            animation-duration: 10s;
            animation-delay: 0.5s;
        }
        
        .floating-math.large {
            font-size: 36px;
            opacity: 0.6;
            animation-duration: 12s;
        }
        
        .glow-line {
            position: absolute;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            z-index: 1;
            animation: glowTravel 8s linear infinite;
            opacity: 0.7;
        }
        
        @keyframes glowTravel {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100vw); }
        }
        
        ::-webkit-scrollbar {
            width: 10px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(30, 30, 30, 0.8);
            border-radius: 5px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(var(--accent), #ffb800);
            border-radius: 5px;
            border: 2px solid rgba(30, 30, 30, 0.8);
        }
        
        .text-yellow-400 {
            color: var(--accent);
        }
        
        .text-xl {
            font-size: 1.3rem;
            line-height: 1.8rem;
        }
        
        .text-2xl {
            font-size: 1.7rem;
            line-height: 2.2rem;
        }
        
        .font-bold {
            font-weight: 700;
        }
        
        .font-semibold {
            font-weight: 600;
        }
        
        .mb-2 {
            margin-bottom: 0.6rem;
        }
        
        .mb-4 {
            margin-bottom: 1.2rem;
        }
        
        .grid {
            display: grid;
        }
        
        .grid-cols-1 {
            grid-template-columns: repeat(1, minmax(0, 1fr));
        }
        
        @media (min-width: 640px) {
            .sm\:grid-cols-2 {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }
        
        .gap-2 {
            gap: 0.7rem;
        }
        
        .p-4 {
            padding: 1.2rem;
        }
        
        .flex {
            display: flex;
        }
        
        .items-center {
            align-items: center;
        }
        
        .gap-2 {
            gap: 0.7rem;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <!-- Floating math symbols -->
    <div class="floating-math" style="top: 5%; left: 3%; animation-delay: 0s;">π</div>
    <div class="floating-math large" style="top: 10%; right: 4%; animation-delay: 1s;">∞</div>
    <div class="floating-math small" style="bottom: 15%; left: 5%; animation-delay: 2s;">∫</div>
    <div class="floating-math" style="bottom: 10%; right: 6%; animation-delay: 3s;">∑</div>
    <div class="floating-math small" style="top: 25%; left: 2%; animation-delay: 0.5s;">√</div>
    <div class="floating-math" style="top: 20%; right: 3%; animation-delay: 1.5s;">θ</div>
    <div class="floating-math large" style="bottom: 25%; left: 3%; animation-delay: 2.5s;">Δ</div>
    <div class="floating-math small" style="bottom: 20%; right: 4%; animation-delay: 3.5s;">≈</div>
    <div class="floating-math" style="top: 40%; left: 1%; animation-delay: 0.8s;">≠</div>
    <div class="floating-math small" style="top: 35%; right: 2%; animation-delay: 1.8s;">≡</div>
    <div class="floating-math large" style="bottom: 40%; left: 2%; animation-delay: 2.8s;">±</div>
    <div class="floating-math" style="bottom: 35%; right: 3%; animation-delay: 3.8s;">≤</div>
    
    <!-- Glowing lines -->
    <div class="glow-line" style="top: 20%; width: 30vw; animation-delay: 0s;"></div>
    <div class="glow-line" style="top: 50%; width: 40vw; animation-delay: 2s;"></div>
    <div class="glow-line" style="top: 80%; width: 35vw; animation-delay: 4s;"></div>
    <div class="glow-line" style="top: 30%; width: 25vw; animation-delay: 1s; animation-duration: 10s;"></div>
    <div class="glow-line" style="top: 70%; width: 45vw; animation-delay: 3s; animation-duration: 12s;"></div>
    
    <div class="chat-container">
        <div class="chat-header">
            <h1 class="text-2xl font-bold">Math Solver Chat</h1>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="welcome-message">
                <h2 class="text-xl font-semibold mb-2 text-yellow-400">Welcome to Math Solver! 🧮</h2>
                <p class="mb-4">Ask me to solve any math problem. Try something like:</p>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 mb-4">
                    <button class="example-button" data-prompt="2 + 3 * 4">2 + 3 * 4</button>
                    <button class="example-button" data-prompt="solve x + 5 = 12">solve x + 5 = 12</button>
                    <button class="example-button" data-prompt="derivative of x^2">derivative of x^2</button>
                    <button class="example-button" data-prompt="integrate x^2">integrate x^2</button>
                    <button class="example-button" data-prompt="simplify 2x + 3x + 4">simplify 2x + 3x + 4</button>
                    <button class="example-button" data-prompt="factor x^2 + 5x + 6">factor x² + 5x + 6</button>
                    <button class="example-button" data-prompt="stats for 10, 15, 20, 25">stats for 10, 15, 20, 25</button>
                    <button class="example-button" data-prompt="limit of (sin x)/x as x approaches 0">limit of (sin x)/x as x→0</button>
                </div>
                
                <p>You can also upload data files for more complex calculations.</p>
            </div>
        </div>
        
        <div class="input-area">
            <input type="text" class="math-input" id="mathInput" placeholder="Type a math problem...">
            <button class="send-button" id="sendButton">
                Send
            </button>
        </div>
    </div>

    <script>
        // Initialize 3D background with enhanced effects
        function init3DBackground() {
            const container = document.getElementById('canvas-container');
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 5000);
            const renderer = new THREE.WebGLRenderer({ 
                antialias: true, 
                alpha: true,
                powerPreference: "high-performance"
            });
            
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);
            
            // Create multiple particle systems for depth
            const createParticleSystem = (count, size, distance, speed) => {
                const particles = new THREE.Group();
                scene.add(particles);
                
                const positions = new Float32Array(count * 3);
                const colors = new Float32Array(count * 3);
                const sizes = new Float32Array(count);
                
                const mathSymbols = ['π', '∞', '∫', '∑', '√', 'θ', 'Δ', '≈', '≠', '≡', '±', '≤', '≥', '÷', '×', 'α', 'β', 'γ', 'δ', 'ε'];
                
                for (let i = 0; i < count; i++) {
                    positions[i * 3] = (Math.random() - 0.5) * distance;
                    positions[i * 3 + 1] = (Math.random() - 0.5) * distance;
                    positions[i * 3 + 2] = (Math.random() - 0.5) * distance;
                    
                    // Color variations
                    colors[i * 3] = 0.7 + Math.random() * 0.3; // R
                    colors[i * 3 + 1] = 0.5 + Math.random() * 0.5; // G
                    colors[i * 3 + 2] = 0.3 + Math.random() * 0.7; // B
                    
                    sizes[i] = size * (0.5 + Math.random() * 0.5);
                }
                
                const particleGeometry = new THREE.BufferGeometry();
                particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                particleGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
                particleGeometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
                
                // Create texture with random math symbol
                const canvas = document.createElement('canvas');
                canvas.width = 128;
                canvas.height = 128;
                const context = canvas.getContext('2d');
                context.fillStyle = '#000000';
                context.fillRect(0, 0, canvas.width, canvas.height);
                context.font = 'Bold 80px Arial';
                context.textAlign = 'center';
                context.textBaseline = 'middle';
                context.fillStyle = '#ffffff';
                context.fillText(mathSymbols[Math.floor(Math.random() * mathSymbols.length)], 64, 64);
                
                const texture = new THREE.CanvasTexture(canvas);
                
                const particleMaterial = new THREE.PointsMaterial({
                    size: size,
                    map: texture,
                    blending: THREE.AdditiveBlending,
                    transparent: true,
                    opacity: 0.8,
                    vertexColors: true,
                    depthTest: false
                });
                
                const particleSystem = new THREE.Points(particleGeometry, particleMaterial);
                particleSystem.userData = { speed: speed };
                particles.add(particleSystem);
                
                return particles;
            };
            
            // Create multiple layers of particles
            const particleSystems = [
                createParticleSystem(200, 15, 2000, 0.0003),  // Far, small, slow
                createParticleSystem(150, 25, 1500, 0.0005),  // Medium
                createParticleSystem(100, 40, 1000, 0.0008)   // Close, large, fast
            ];
            
            // Add glowing lines in 3D space
            const lineGeometry = new THREE.BufferGeometry();
            const linePositions = new Float32Array(6);
            lineGeometry.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));
            
            const lineMaterial = new THREE.LineBasicMaterial({
                color: 0xffd700,
                transparent: true,
                opacity: 0.6
            });
            
            const lines = [];
            for (let i = 0; i < 10; i++) {
                const line = new THREE.Line(lineGeometry, lineMaterial);
                resetLinePosition(line);
                scene.add(line);
                lines.push(line);
            }
            
            function resetLinePosition(line) {
                const positions = line.geometry.attributes.position.array;
                
                // Random start and end points
                positions[0] = (Math.random() - 0.5) * 2000;
                positions[1] = (Math.random() - 0.5) * 2000;
                positions[2] = (Math.random() - 0.5) * 2000;
                
                positions[3] = positions[0] + (Math.random() - 0.5) * 500;
                positions[4] = positions[1] + (Math.random() - 0.5) * 500;
                positions[5] = positions[2] + (Math.random() - 0.5) * 500;
                
                line.geometry.attributes.position.needsUpdate = true;
                line.userData = {
                    progress: 0,
                    speed: 0.001 + Math.random() * 0.002
                };
            }
            
            // Add a central glowing orb
            const orbGeometry = new THREE.SphereGeometry(30, 32, 32);
            const orbMaterial = new THREE.MeshBasicMaterial({
                color: 0xffd700,
                transparent: true,
                opacity: 0.2,
                blending: THREE.AdditiveBlending
            });
            const orb = new THREE.Mesh(orbGeometry, orbMaterial);
            scene.add(orb);
            
            // Add lights
            const ambientLight = new THREE.AmbientLight(0x404040);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffd700, 0.5);
            directionalLight.position.set(1, 1, 1).normalize();
            scene.add(directionalLight);
            
            const pointLight = new THREE.PointLight(0x9c27b0, 1, 500);
            pointLight.position.set(0, 0, 100);
            scene.add(pointLight);
            
            camera.position.z = 500;
            
            // Animation loop
            function animate() {
                requestAnimationFrame(animate);
                
                // Rotate particle systems at different speeds
                particleSystems.forEach((system, index) => {
                    const speed = system.children[0].userData.speed;
                    system.rotation.x += speed * (index + 1);
                    system.rotation.y += speed * (index + 1) * 0.7;
                });
                
                // Animate lines
                lines.forEach(line => {
                    const positions = line.geometry.attributes.position.array;
                    line.userData.progress += line.userData.speed;
                    
                    if (line.userData.progress > 1) {
                        resetLinePosition(line);
                    } else {
                        // Extend line
                        const dirX = positions[3] - positions[0];
                        const dirY = positions[4] - positions[1];
                        const dirZ = positions[5] - positions[2];
                        
                        positions[3] = positions[0] + dirX * (1 + line.userData.progress);
                        positions[4] = positions[1] + dirY * (1 + line.userData.progress);
                        positions[5] = positions[2] + dirZ * (1 + line.userData.progress);
                        
                        line.geometry.attributes.position.needsUpdate = true;
                    }
                });
                
                // Pulsing orb
                orb.scale.x = orb.scale.y = orb.scale.z = 1 + Math.sin(Date.now() * 0.001) * 0.1;
                
                renderer.render(scene, camera);
            }
            
            animate();
            
            // Handle window resize
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize 3D background
            init3DBackground();
            
            // Chat functionality
            const mathInput = document.getElementById('mathInput');
            const sendButton = document.getElementById('sendButton');
            const chatMessages = document.getElementById('chatMessages');
            const exampleButtons = document.querySelectorAll('.example-button');
            
            let showSteps = true;
            let isFirstMessage = true;
            
            // Example button click handler
            exampleButtons.forEach(button => {
                button.addEventListener('click', function() {
                    const prompt = this.getAttribute('data-prompt');
                    mathInput.value = prompt;
                    sendMessage(prompt);
                });
            });
            
            // Send button click handler
            sendButton.addEventListener('click', sendMessage);
            
            // Enter key handler
            mathInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    sendMessage();
                }
            });
            
            async function sendMessage(overrideText) {
                const message = overrideText || mathInput.value.trim();
                if (!message) return;
                
                if (isFirstMessage) {
                    document.querySelector('.welcome-message').style.display = 'none';
                    isFirstMessage = false;
                }
                
                // Add user message
                addMessage('user', message);
                
                if (!overrideText) {
                    mathInput.value = '';
                }
                
                // Show loading indicator
                const loadingId = 'loading-' + Date.now();
                const loadingDiv = document.createElement('div');
                loadingDiv.id = loadingId;
                loadingDiv.className = 'flex items-center gap-2 p-4';
                loadingDiv.innerHTML = `
                    <div class="loading-spinner"></div>
                    <span>Solving your math problem...</span>
                `;
                chatMessages.appendChild(loadingDiv);
                scrollToBottom();
                
                try {
                    const solution = await getMathSolution(message);
                    
                    // Remove loading indicator
                    chatMessages.removeChild(loadingDiv);
                    
                    // Add bot response
                    addMessage('bot', formatSolution(solution));
                } catch (error) {
                    console.error('Error:', error);
                    chatMessages.removeChild(loadingDiv);
                    addMessage('bot', "Sorry, I couldn't solve that problem. Please try again.");
                }
            }
            
            function addMessage(type, content) {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${type}-message`;
                messageDiv.innerHTML = content;
                chatMessages.appendChild(messageDiv);
                scrollToBottom();
            }
            
            function scrollToBottom() {
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
            
            function formatSolution(solution) {
                // Enhance formatting for math expressions
                return solution
                    .replace(/\n/g, '<br>')
                    .replace(/\^(\d+)/g, '<sup>$1</sup>')
                    .replace(/_(\d+)/g, '<sub>$1</sub>')
                    .replace(/\*(.*?)\*/g, '<strong>$1</strong>')
                    .replace(/```([^`]+)```/g, '<div class="code-block">$1</div>');
            }
